services:
  slowmeet:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      # The Go runtime does not read the container's cgroup memory limit; pin
      # the soft heap limit (~80% of SLOWMEET_MEMORY_LIMIT) so join storms or
      # screen shares can never push the process into a cgroup OOM kill.
      GOMEMLIMIT: "${SLOWMEET_GOMEMLIMIT:-200MiB}"
    ports:
      - "${HTTP_PUBLISH_ADDRESS:-127.0.0.1}:${HTTP_PUBLISH_PORT:-8080}:8080"
      - "${ICE_UDP_PORT_MIN:-50000}-${ICE_UDP_PORT_MAX:-50100}:${ICE_UDP_PORT_MIN:-50000}-${ICE_UDP_PORT_MAX:-50100}/udp"
    volumes:
      - slowmeet-data:/app/data:Z
    deploy:
      resources:
        limits:
          cpus: "${SLOWMEET_CPUS:-0.75}"
          memory: "${SLOWMEET_MEMORY_LIMIT:-256m}"
          pids: ${SLOWMEET_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  slowmeet-data:

services:
  slowmeet:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "${ICE_UDP_PORT_MIN:-50000}-${ICE_UDP_PORT_MAX:-50100}:${ICE_UDP_PORT_MIN:-50000}-${ICE_UDP_PORT_MAX:-50100}/udp"
    volumes:
      - slowmeet-data:/app/data:Z
    deploy:
      resources:
        limits:
          cpus: "${SLOWMEET_CPUS:-1.0}"
          memory: "${SLOWMEET_MEMORY_LIMIT:-256m}"
          pids: ${SLOWMEET_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.18.0-r0-alpine
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /var/lib/coturn:size=16m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - "${TURN_CONFIG_FILE:-./deploy/coturn/turnserver.conf}:/etc/coturn/turnserver.conf:ro,Z"
      - "${TURN_CERT_DIR:-./deploy/coturn/certs}:/etc/letsencrypt:ro,Z"
    deploy:
      resources:
        limits:
          cpus: "${TURN_CPUS:-0.5}"
          memory: "${TURN_MEMORY_LIMIT:-128m}"
          pids: ${TURN_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    command: ["-c", "/etc/coturn/turnserver.conf", "--log-file=stdout"]

volumes:
  slowmeet-data:

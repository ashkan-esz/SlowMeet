name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run application checks
        # test-meeting-layout currently expects mobile-chat/mobile-people
        # elements that are absent from the existing web/index.html baseline.
        run: make fmt-check test vet build test-admin test-protocol test-adaptation

      - name: Verify container definition parity
        run: make container-parity

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag slowmeet:ci \
            --build-arg VERSION=ci \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Build Podman image
        run: |
          podman build \
            --format docker \
            --file Containerfile \
            --tag slowmeet:ci-podman \
            --build-arg VERSION=ci \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

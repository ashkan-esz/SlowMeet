name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run application checks
        run: make check

      - name: Scan reachable Go dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Scan browser test dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify release tag behavior
        shell: bash
        run: |
          test "$(scripts/release-tags.sh v1.2.3 docker example/image abc | wc -l)" -eq 5
          test "$(scripts/release-tags.sh v1.2.3-rc.1 docker example/image abc | wc -l)" -eq 2
          test "$(scripts/release-tags.sh v1.2.3 docker example/image abc immutable | wc -l)" -eq 2
          test "$(scripts/release-tags.sh v1.2.3 docker example/image abc aliases | wc -l)" -eq 3
          test -z "$(scripts/release-tags.sh v1.2.3-rc.1 docker example/image abc aliases)"
          if scripts/release-tags.sh v1.2 docker example/image abc >/dev/null 2>&1; then
            echo "invalid release tag was accepted"
            exit 1
          fi

      - name: Verify container definition parity
        run: make container-parity

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman shellcheck

      - name: Check installer shell syntax and style
        run: |
          bash -n deploy/install.sh
          bash -n scripts/test-installer-config.sh
          bash -n scripts/test-docker-lxc-runtime-fallback.sh
          bash -n scripts/test-caddy-install-fallback.sh
          bash -n scripts/test-xray-fallback.sh
          bash -n scripts/test-container-bindings.sh
          shellcheck -S style deploy/install.sh scripts/test-installer-config.sh scripts/test-docker-lxc-runtime-fallback.sh scripts/test-caddy-install-fallback.sh scripts/test-xray-fallback.sh scripts/test-container-bindings.sh
          bash scripts/test-installer-config.sh
          bash scripts/test-docker-lxc-runtime-fallback.sh
          bash scripts/test-caddy-install-fallback.sh
          bash scripts/test-xray-fallback.sh
          bash scripts/test-container-bindings.sh

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: slowmeet:ci
          cache-from: type=gha,scope=slowmeet
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=slowmeet' || '' }}
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}

      - name: Build Podman image
        run: |
          podman build \
            --format docker \
            --file Containerfile \
            --tag slowmeet:ci-podman \
            --build-arg VERSION=ci \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

  weaknet:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Ubuntu 24.04 blocks unprivileged user namespaces
      # (kernel.apparmor_restrict_unprivileged_userns=1), which the netns
      # suites need for unshare --user --map-root-user; GitHub declined to
      # change the image (actions/runner-images #10443, #10015). The hosted
      # runner has passwordless sudo, and iproute2/tc is preinstalled.
      - name: Allow unprivileged user namespaces for the netns suites
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the Go weak-network integration suite in an isolated namespace
        run: make test-weaknet

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright-core install chromium firefox

      - name: Run the isolated browser network profile
        run: ./scripts/test-media-e2e-netns.sh

      - name: Run the four-person mixed-quality room scenarios in an isolated namespace
        run: MEDIA_E2E_FOUR_SCENARIO="mixed-quality-room,screen-share-mixed-quality" make test-media-e2e-four-netns

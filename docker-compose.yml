services:
  slowmeet:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "${ICE_UDP_PORT_MIN:-50000}-${ICE_UDP_PORT_MAX:-50100}:${ICE_UDP_PORT_MIN:-50000}-${ICE_UDP_PORT_MAX:-50100}/udp"
    volumes:
      - slowmeet-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  slowmeet-data:
